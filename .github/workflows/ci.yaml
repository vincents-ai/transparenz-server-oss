name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.0
          args: --timeout=5m

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Download dependencies
        run: go mod download
      - name: Unit tests
        run: go test -v -race -coverprofile=coverage.out ./pkg/... ./internal/...
      - name: Check coverage
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${COVERAGE}%"
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 7

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: transparenz
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Download dependencies
        run: go mod download
      - name: Run migrations
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/transparenz?sslmode=disable
        run: go run ./cmd/migrate
      - name: Integration tests
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/transparenz?sslmode=disable
          JWT_SECRET: test-jwt-secret-for-ci-minimum-32-characters-long
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
        run: go test -v -tags integration -count=1 -timeout 10m ./tests/integration/...

  bdd:
    name: BDD Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: transparenz
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Download dependencies
        run: go mod download
      - name: Run migrations
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/transparenz?sslmode=disable
        run: go run ./cmd/migrate
      - name: BDD tests
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/transparenz?sslmode=disable
          JWT_SECRET: test-jwt-secret-for-ci-minimum-32-characters-long
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
        run: go test -v -tags bdd -count=1 -timeout 10m ./bdd/...

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Build binary
        run: go build -ldflags "-s -w" -o bin/transparenz-server ./cmd/server
