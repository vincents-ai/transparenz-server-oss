name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v7
        with:
          # Pinned to a release built with Go >= the module's target. v2.0 was
          # built with Go 1.24 and refuses to load a config for a 1.26 module:
          # "can't load config: the Go language version (go1.24) used to build
          # golangci-lint is lower than the targeted Go version".
          version: v2.11.4
          args: --timeout=5m

  # Regulatory conformance gate.
  #
  # This is separate from the unit-test job on purpose. The regulatory packages
  # are pure and fast, and a failure here means something specific and serious:
  # the reporting schema we hold has diverged from the ENISA SRP glossary it was
  # transcribed from, or a required reporting field can no longer be
  # represented internally.
  #
  # Both are release-blocking for a manufacturer relying on this product to
  # demonstrate what it reported and why, so they get their own named job rather
  # than disappearing into a generic test failure. Drop the `-v` if the log
  # becomes unwieldy as fields are added.
  regulatory-conformance:
    name: Regulatory conformance (ENISA SRP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Download dependencies
        run: go mod download
      - name: ENISA SRP schema and field conformance
        run: go test -v -count=1 ./pkg/regulatory/...
      - name: Regulatory clock conformance
        run: >
          go test -v -count=1 -run 'Deadline|FinalReport|Clock|DST|Month|Awareness'
          ./pkg/regulatory/... ./pkg/services/...

  # CRA reporting persistence.
  #
  # The CRA tables use PostgreSQL features the unit-test schema cannot express:
  # text[] columns, CHECK constraints over cardinality(), PL/pgSQL trigger
  # functions enforcing append-only audit logs, and an ON CONFLICT upsert.
  # Testing them against SQLite would test a different schema than the one that
  # ships — in particular the append-only guarantees on the decision log and
  # the awareness audit trail would simply not exist, and the tests would pass
  # while proving nothing.
  cra-persistence:
    name: CRA reporting persistence
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Download dependencies
        run: go mod download
      - name: Apply the CRA reporting migration
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE SCHEMA compliance;" \
                                     -c "CREATE TABLE compliance.organizations (id UUID PRIMARY KEY DEFAULT gen_random_uuid());"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/000045_cra_reports.up.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/000050_cra_srp_packages.up.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/000051_cra_filing_facts.up.sql
      - name: CRA repository against PostgreSQL
        run: go test -v -count=1 -tags integration -run 'TestCRARepository' ./tests/integration/...

  test:
    name: Test
    runs-on: ubuntu-latest
    # A database is required here, not only in the integration and bdd jobs.
    # internal/testutil/TestMigrationsApplyToEmptyDatabase applies every migration to a
    # live PostgreSQL and skips when TEST_DATABASE_URL is unset, so without this the
    # only test that proves the schema actually builds never runs in this job. A skip
    # names a missing environment variable rather than a failing assertion, so it is
    # easy to miss in output and easy to leave in place after someone deletes an
    # apparently unused service block.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: transparenz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://user:pass@localhost:5432/transparenz_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Download dependencies
        run: go mod download
      # The repository tests write real rows against a real database, so the schema
      # has to exist before they run. Without this step they failed against an
      # empty database with "column ... does not exist" and "relation does not
      # exist" — errors that read like product bugs and were only ever seen here.
      - name: Apply migrations
        run: go run ./cmd/migrate
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      # -p 1 is required here, not a preference: internal/testutil's migration test
      # drops and re-creates the compliance schema, so any package running
      # concurrently against the same database fails with errors that look like
      # product bugs ("column csirt_endpoint does not exist"). Verified by running
      # the suite both ways against a live PostgreSQL.
      - name: Unit tests
        run: go test -v -race -p 1 -coverprofile=coverage.out ./pkg/... ./internal/...

      # The integration-tagged tests in pkg/... and internal/... were never built
      # by any job — the only integration job targets ./tests/integration — and one
      # of them had stopped compiling entirely. Building them here (and running
      # them against the job's database) is what keeps that from rotting again.
      - name: Integration-tagged tests in pkg and internal
        # -p 1 for the same reason as the job above: internal/testutil's migration
        # test drops and re-creates the compliance schema, so a package running
        # concurrently against the same database fails for reasons unrelated to
        # its own code.
        run: go test -count=1 -p 1 -tags integration ./pkg/... ./internal/...
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - name: Check coverage
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${COVERAGE}%"
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 7

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: transparenz
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Download dependencies
        run: go mod download
      - name: Run migrations
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/transparenz?sslmode=disable
        run: go run ./cmd/migrate
      - name: Integration tests
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/transparenz?sslmode=disable
          JWT_SECRET: test-jwt-secret-for-ci-minimum-32-characters-long
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
        run: go test -v -tags integration -count=1 -timeout 10m ./tests/integration/...

  bdd:
    name: BDD Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: transparenz
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Download dependencies
        run: go mod download
      - name: Run migrations
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/transparenz?sslmode=disable
        run: go run ./cmd/migrate
      - name: BDD tests
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/transparenz?sslmode=disable
          JWT_SECRET: test-jwt-secret-for-ci-minimum-32-characters-long
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
        run: go test -v -tags bdd -count=1 -timeout 10m ./bdd/...

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build binary
        run: go build -ldflags "-s -w" -o bin/transparenz-server ./cmd/server

  vuln:
    name: Reachable vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0

      # Fails only when a reachable advisory has a published fix. A gate that is red
      # for unfixable reasons gets routed around, which is worse than no gate.
      - name: Scan for reachable vulnerabilities
        run: make govuln
